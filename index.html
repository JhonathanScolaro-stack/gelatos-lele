  <title>Gelatos Lele — Gestão</title>
</head>
<body>
  <div id="app"></div>
  <script>
    // Um único registro controla as atualizações. Antes, o HTML registrava a
    // versão nova e o JavaScript registrava uma versão antiga, fazendo o PWA
    // alternar de worker e aparentar uma atualização a cada abertura.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js?v=71').then(function (registration) {
          registration.update().catch(function () {});
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (sessionStorage.getItem('gelatos-app-reloaded-v71')) return;
            sessionStorage.setItem('gelatos-app-reloaded-v71', '1');
            window.location.reload();
          }, { once: true });
        }).catch(function () {});
      });
    }
  </script>
  <script src="business-core.js?v=62"></script>
  <script src="cloud-config.js?v=62"></script>
  <script src="cloud-sync.js?v=71"></script>
  <script src="app-v18.js?v=71"></script>
</body>
</html>
