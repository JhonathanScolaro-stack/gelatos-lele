<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d85e78">
  <meta name="description" content="Gestão de receitas, estoque, pedidos, financeiro e relatórios da Gelatos Lele.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-oficial-v2.png">
  <link rel="stylesheet" href="styles-v18.css?v=47">
  <link rel="stylesheet" href="styles-v32.css?v=47">
  <title>Gelatos Lele — Gestão</title>
</head>
<body>
  <div id="app"></div>
  <button id="appUpdate" type="button" hidden>Atualização pronta — tocar para abrir</button>
  <script>
    // A área de gestão atualiza o cache mesmo quando o celular vinha usando
    // uma versão antiga instalada do app.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js?v=47').then(function (registration) {
          registration.update();
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (sessionStorage.getItem('gelatos-app-reloaded-v47')) return;
            sessionStorage.setItem('gelatos-app-reloaded-v47', '1');
            window.location.reload();
          }, { once: true });
        }).catch(function () {});
      });
    }
  </script>
  <script src="business-core.js?v=47"></script>
  <script src="cloud-config.js?v=47"></script>
  <script src="cloud-sync.js?v=47"></script>
  <script src="app-v18.js?v=47"></script>
</body>
</html>
