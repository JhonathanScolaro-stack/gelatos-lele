<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d85e78">
  <meta name="description" content="Gestão de receitas, estoque, pedidos, financeiro e relatórios da Gelatos Lele.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-oficial-v2.png">
  <link rel="stylesheet" href="styles-v18.css?v=59">
  <link rel="stylesheet" href="styles-v32.css?v=59">
  <link rel="stylesheet" href="styles-v51.css?v=59">
  <link rel="stylesheet" href="styles-v59.css?v=59">
  <link rel="stylesheet" href="styles-v60.css?v=60">
  <link rel="stylesheet" href="styles-v61.css?v=61">
  <link rel="stylesheet" href="styles-v62.css?v=62">
  <!-- UIcons oficiais da Flaticon. Os SVGs próprios seguem como reserva no
       modo offline, para o PWA não perder ícones sem internet. -->
  <link rel="stylesheet" href="https://media.flaticon.com/dist/css/fi-uIcons.1610ac96d7802fe35fea.css">
  <title>Gelatos Lele — Gestão</title>
</head>
<body>
  <div id="app"></div>
  <script>
    // Um único registro controla as atualizações. Antes, o HTML registrava a
    // versão nova e o JavaScript registrava uma versão antiga, fazendo o PWA
    // alternar de worker e aparentar uma atualização a cada abertura.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js?v=62').then(function (registration) {
          registration.update().catch(function () {});
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (sessionStorage.getItem('gelatos-app-reloaded-v62')) return;
            sessionStorage.setItem('gelatos-app-reloaded-v62', '1');
            window.location.reload();
          }, { once: true });
        }).catch(function () {});
      });
    }
    // Quando a fonte UIcons estiver disponível, o app usa os ícones oficiais.
    // Sem conexão, os vetores locais continuam aparecendo normalmente.
    if (document.fonts && document.fonts.load) {
      document.fonts.load('1em "uicons-solid-rounded"').then(function () {
        document.documentElement.classList.add('uicons-loaded');
      }).catch(function () {});
    }
  </script>
  <script src="business-core.js?v=62"></script>
  <script src="cloud-config.js?v=62"></script>
  <script src="cloud-sync.js?v=62"></script>
  <script src="app-v18.js?v=62"></script>
</body>
</html>
