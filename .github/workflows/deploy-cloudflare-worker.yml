name: Deploy Gelatos Lele sync worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-sync-worker.js'
      - 'send.mjs'
      - 'vapid.mjs'
      - 'encrypt.mjs'
      - 'errors.mjs'
      - 'wrangler.toml'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          # Mantém segredos cadastrados diretamente na Cloudflare (VAPID,
          # bootstrap etc.) em cada publicação. Sem isto, um deploy pode
          # apagar a configuração de notificações já ativa.
          command: deploy --keep-vars
